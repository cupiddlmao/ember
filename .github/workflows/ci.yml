name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python core, bridge and mobile backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r mobile/backend/requirements.txt

      - name: Run shared-core and mobile backend tests
        run: python -m unittest discover -q

      - name: Run desktop bridge, cache and library tests
        working-directory: desktop-rust
        run: python -m unittest -q test_bridge.py test_cache.py test_library.py

  rust:
    name: Rust desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GTK, GStreamer and libsoup development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsoup-3.0-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        working-directory: desktop-rust
        run: cargo test --locked
