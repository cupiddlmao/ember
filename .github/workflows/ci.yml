name: CI

# Pull requests run this workflow. A push runs it on main only, to verify the
# merge result: an unscoped `push` also ran every branch push, so each pull
# request cost two full runs of the same jobs and put two `apt-get install`
# steps on the same package mirror at once.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Grouped on the commit so a re-run, or a second event for the same sha, cannot
# start a competing run. cancel-in-progress stays false on purpose: a cancelled
# run reports its required checks as "cancelled", which branch protection treats
# as a failure and blocks the merge.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  python:
    name: Python core, bridge and mobile backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r mobile/backend/requirements.txt

      - name: Run shared-core and mobile backend tests
        run: python -m unittest discover -q

      - name: Run desktop bridge, cache and library tests
        working-directory: desktop-rust
        run: python -m unittest -q test_bridge.py test_cache.py test_library.py

      # Same property the IPA build enforces: an artifact must record the commit
      # it came from, so a running container can be traced back to a revision
      # instead of only to a version tag that can be moved.
      - name: Build the backend image recording this commit
        run: |
          set -euo pipefail
          docker build \
            --build-arg EMBER_GIT_COMMIT="${{ github.sha }}" \
            -f mobile/backend/Dockerfile \
            -t ember-mobile-api:ci \
            .

      - name: Verify the backend image records the dispatched ref
        env:
          DISPATCHED_REF: ${{ github.ref }}
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RECORDED=$(docker image inspect --format \
            '{{if .Config.Labels}}{{index .Config.Labels "org.opencontainers.image.revision"}}{{end}}' \
            ember-mobile-api:ci || true)
          echo "dispatched ref: $DISPATCHED_REF"
          echo "dispatched sha: $DISPATCHED_SHA"
          echo "image revision: $RECORDED"
          if [ "$RECORDED" != "$DISPATCHED_SHA" ]; then
            echo "::error::The image records '$RECORDED', but $DISPATCHED_REF was dispatched at $DISPATCHED_SHA"
            exit 1
          fi
          echo "Image matches $DISPATCHED_REF"

  rust:
    name: Rust desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve apt package set
        id: apt
        run: |
          set -euo pipefail
          PACKAGES="ffmpeg
          gstreamer1.0-plugins-base
          gstreamer1.0-plugins-good
          libgtk-4-dev
          libgstreamer1.0-dev
          libgstreamer-plugins-base1.0-dev
          libsoup-3.0-dev
          pkg-config"
          printf 'hash=%s\n' "$(printf '%s' "$PACKAGES" | tr -d '[:space:]' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          { echo 'packages<<APT_PACKAGES_EOF'; echo "$PACKAGES"; echo 'APT_PACKAGES_EOF'; } >> "$GITHUB_OUTPUT"

      # The mirror has stalled mid-download often enough that a plain install
      # fails roughly one run in three, always partway through the `Get:` lines.
      # Cached .debs let the install run with --no-download and skip the mirror
      # entirely. The key follows the package list, so adding a package misses
      # the cache rather than installing a stale set.
      - name: Restore cached apt packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/ember-apt
          key: apt-${{ runner.os }}-${{ steps.apt.outputs.hash }}

      - name: Install GTK, GStreamer and libsoup development packages
        # Still a backstop: a cache miss installs from the mirror, and this bound
        # fails the job in ten minutes instead of leaving every required check
        # pending behind a run that is stuck "in progress".
        timeout-minutes: 10
        env:
          PACKAGES: ${{ steps.apt.outputs.packages }}
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/ember-apt
          # apt only reads its own archive directory, so stage the cache there.
          sudo cp -n ~/.cache/ember-apt/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          # Bound each transfer so a stalled mirror aborts and retries rather than
          # hanging until the step timeout; apt has no useful default here.
          APT_OPTS=(-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3)
          sudo apt-get update "${APT_OPTS[@]}"
          # --no-download installs nothing unless every deb is already cached, so
          # a miss or a changed package set falls back to fetching.
          sudo apt-get install -y "${APT_OPTS[@]}" --no-download $PACKAGES \
            || sudo apt-get install -y "${APT_OPTS[@]}" $PACKAGES
          # Hand the debs back for the post-job cache save.
          cp -n /var/cache/apt/archives/*.deb ~/.cache/ember-apt/ 2>/dev/null || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        working-directory: desktop-rust
        run: cargo test --locked

  ios:
    name: iOS Swift checks
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check audio cache eviction
        run: |
          swiftc -parse-as-library \
            mobile/ios/EmberMobile/Models/Track.swift \
            mobile/ios/EmberMobile/Services/APIClient.swift \
            mobile/ios/tests/AudioCacheCheck.swift \
            -o /tmp/ember-cache-check
          /tmp/ember-cache-check

      - name: Check shared playlist retries, conflicts, and private offline cache
        run: |
          swiftc -parse-as-library \
            mobile/ios/EmberMobile/Models/Track.swift \
            mobile/ios/EmberMobile/Services/APIClient.swift \
            mobile/ios/EmberMobile/Services/SharedLibraryModel.swift \
            mobile/ios/tests/SharedLibraryCheck.swift \
            -o /tmp/ember-library-check
          /tmp/ember-library-check

      - name: Check Last.fm listening excludes pause, buffering and seeks
        run: |
          swiftc -parse-as-library \
            mobile/ios/EmberMobile/Models/Track.swift \
            mobile/ios/EmberMobile/Services/APIClient.swift \
            mobile/ios/EmberMobile/Services/LastFMReporter.swift \
            mobile/ios/tests/LastFMCheck.swift \
            -o /tmp/ember-lastfm-check
          /tmp/ember-lastfm-check

      - name: Check queue ordering and stale-request invalidation
        run: |
          swiftc -parse-as-library \
            mobile/ios/EmberMobile/Models/Track.swift \
            mobile/ios/EmberMobile/Models/PlaybackQueue.swift \
            mobile/ios/tests/QueueCheck.swift \
            -o /tmp/ember-queue-check
          /tmp/ember-queue-check

      - name: Check pending playback and queue recovery
        run: |
          swiftc -parse-as-library \
            mobile/ios/EmberMobile/Models/Track.swift \
            mobile/ios/EmberMobile/Models/PlaybackQueue.swift \
            mobile/ios/EmberMobile/Services/AppModel.swift \
            mobile/ios/tests/AppModelCheck.swift \
            -o /tmp/ember-model-check
          /tmp/ember-model-check

      - name: Check lyric timing offset direction, bounds, and seeking
        run: |
          swiftc -parse-as-library \
            mobile/ios/EmberMobile/Models/Track.swift \
            mobile/ios/EmberMobile/Services/LyricsTiming.swift \
            mobile/ios/tests/LyricsTimingCheck.swift \
            -o /tmp/ember-lyrics-timing-check
          /tmp/ember-lyrics-timing-check
