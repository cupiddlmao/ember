# The project name has to live in the file. Compose otherwise names the project
# after its directory, so a plain `docker compose up -d --build` in
# mobile/backend creates a SECOND stack (backend-api-1) beside the deployed one
# (ember-mobile-api-1), which then dies on the published port and leaves the
# stale container holding it. The docs say `-p ember-mobile`; this makes the
# command that forgets to say so do the same thing.
name: ember-mobile

services:
  api:
    build:
      context: ../..
      dockerfile: mobile/backend/Dockerfile
      args:
        # Records the commit in the image label; CI overrides this with the
        # dispatched SHA. Export EMBER_GIT_COMMIT to stamp local builds too.
        EMBER_GIT_COMMIT: ${EMBER_GIT_COMMIT:-unknown}
    image: ember-mobile-api:0.5.0
    restart: unless-stopped
    environment:
      EMBER_API_TOKEN: ${EMBER_API_TOKEN:?Set EMBER_API_TOKEN in mobile/backend/.env}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_API_SECRET: ${LASTFM_API_SECRET:-}
      EMBER_CACHE_MAX_MB: ${EMBER_CACHE_MAX_MB:-2048}
      EMBER_MAX_AUDIO_MB: ${EMBER_MAX_AUDIO_MB:-48}
      EMBER_TRUSTED_PROXIES: ${EMBER_TRUSTED_PROXIES:-}
      # Optional cookies.txt exported from a signed-in YouTube account, so
      # age-restricted or sign-in-gated recordings can still be fetched.
      EMBER_YOUTUBE_COOKIES: ${EMBER_YOUTUBE_COOKIES:-}
    ports:
      - "127.0.0.1:${EMBER_HOST_PORT:-18080}:8080"
    volumes:
      - audio-cache:/var/lib/ember/cache
      - playlist-library:/var/lib/ember/library
      # Mounted by docker-compose.override.yml when sign-in cookies are in use;
      # see docker-compose.override.example.yml.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8080/v1/health',
          headers={'Authorization': 'Bearer ' + os.environ['EMBER_API_TOKEN']});
          urllib.request.urlopen(request, timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  audio-cache:
  playlist-library:
